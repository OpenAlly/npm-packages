name: Setup
description: Setup Node.js and install the monorepo dependencies

inputs:
  node-version:
    description: Node.js version to install
    default: "24"
  registry-url:
    description: Optional registry to configure in .npmrc (required for publishing)
    default: ""
  install:
    description: Whether to install the monorepo dependencies
    default: "true"

runs:
  using: composite
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm install --ignore-scripts
